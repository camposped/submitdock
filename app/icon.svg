<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Theme aware favicon. The tab strip is painted by the browser, not by this
    page, so it follows prefers-color-scheme rather than SubmitDock's own
    data-theme toggle: what matters is contrast against the chrome the icon
    actually sits in.

    Transparent on purpose. A filled tile would be legible either way and would
    not need any of this; a bare glyph is what has something to gain from
    flipping, and it sits in the tab strip like the browser's own icons.
  -->
  <style>
    .mark { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #fafafa; }
    }
  </style>
